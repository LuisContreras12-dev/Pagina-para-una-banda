{% extends "base.html" %}
{% block title %}Tour{% endblock %}

{% block content %}
<h1 class="mb-4"><i class="bi bi-calendar-event"></i> Próximas Fechas del Tour</h1>

<div class="table-responsive">
    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>Fecha</th>
                <th>Ciudad</th>
                <th>Lugar</th>
                <th>Hora</th>
            </tr>
        </thead>
        <tbody>
            {% for fecha in fechas %}
            <tr>
                <td>{{ fecha.fecha }}</td>
                <td>{{ fecha.ciudad }}</td>
                <td>{{ fecha.lugar }}</td>
                <td>{{ fecha.hora }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}

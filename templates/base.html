<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Coldplay{% endblock %} | Coldplay Fan Page</title>
    {{ bootstrap.load_css() }}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('inicio') }}">🎵 Coldplay</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('inicio') }}">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('tour') }}">Tour</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('discografia') }}">Discografía</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('media') }}">Fotos / Videos</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-dark text-light py-4 mt-auto">
        <div class="container text-center">
            <p class="mb-2">Síguenos en redes sociales</p>
            <div class="d-flex justify-content-center gap-3 mb-3">
                {% for red in redes %}
                <a href="{{ red.url }}" target="_blank" rel="noopener noreferrer"
                   class="text-light fs-4" title="{{ red.nombre }}">
                    <i class="bi {{ red.icono }}"></i>
                </a>
                {% endfor %}
            </div>
            <p class="mb-0 small">&copy; 2026 Coldplay Fan Page. Todos los derechos reservados.</p>
        </div>
    </footer>

    {{ bootstrap.load_js() }}
</body>
</html>

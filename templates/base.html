<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Foo Fighters{% endblock %} | Sitio Oficial</title>

    {{ bootstrap.load_css() }}

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- ═══ Barra de Navegación ═══ -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow">
        <div class="container">
            <a class="navbar-brand fw-bold brand-logo" href="{{ url_for('inicio') }}">
                <i class="bi bi-lightning-charge-fill text-warning"></i> FOO FIGHTERS
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav" aria-controls="navbarNav"
                    aria-expanded="false" aria-label="Navegación">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'inicio' %}active{% endif %}"
                           href="{{ url_for('inicio') }}">
                            <i class="bi bi-house-fill"></i> Inicio
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'tour' %}active{% endif %}"
                           href="{{ url_for('tour') }}">
                            <i class="bi bi-calendar-event"></i> Tour
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'discografia' %}active{% endif %}"
                           href="{{ url_for('discografia') }}">
                            <i class="bi bi-disc"></i> Discografía
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'media' %}active{% endif %}"
                           href="{{ url_for('media') }}">
                            <i class="bi bi-camera-reels"></i> Fotos / Videos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'redes' %}active{% endif %}"
                           href="{{ url_for('redes') }}">
                            <i class="bi bi-share"></i> Redes Sociales
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ═══ Contenido Principal ═══ -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- ═══ Footer ═══ -->
    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container text-center">
            <div class="mb-3">
                <a href="https://www.facebook.com/foofighters" class="text-light mx-2 fs-4" target="_blank"><i class="bi bi-facebook"></i></a>
                <a href="https://www.instagram.com/foofighters" class="text-light mx-2 fs-4" target="_blank"><i class="bi bi-instagram"></i></a>
                <a href="https://twitter.com/foofighters" class="text-light mx-2 fs-4" target="_blank"><i class="bi bi-twitter-x"></i></a>
                <a href="https://www.youtube.com/foofighters" class="text-light mx-2 fs-4" target="_blank"><i class="bi bi-youtube"></i></a>
                <a href="https://open.spotify.com/artist/7jy3rLJdDQY21OgRLCZ9sD" class="text-light mx-2 fs-4" target="_blank"><i class="bi bi-spotify"></i></a>
            </div>
            <p class="mb-1">&copy; 2026 Foo Fighters &mdash; Todos los derechos reservados.</p>
            <p class="text-muted small">Página creada con Flask &amp; Bootstrap-Flask</p>
        </div>
    </footer>

    {{ bootstrap.load_js() }}
</body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      {% block title %}{{ band.name }}{% endblock %} | {{ band.name }}
    </title>
    {{ bootstrap.load_css() }}
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
          <i class="bi bi-music-note-beamed me-2"></i>{{ band.name }}
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a
                class="nav-link {% if request.endpoint == 'index' %}active{% endif %}"
                href="{{ url_for('index') }}"
              >
                <i class="bi bi-house me-1"></i>Inicio
              </a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link {% if request.endpoint == 'tour' %}active{% endif %}"
                href="{{ url_for('tour') }}"
              >
                <i class="bi bi-map me-1"></i>Tour
              </a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link {% if request.endpoint == 'discografia' %}active{% endif %}"
                href="{{ url_for('discografia') }}"
              >
                <i class="bi bi-vinyl me-1"></i>Discografía
              </a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link {% if request.endpoint == 'media' %}active{% endif %}"
                href="{{ url_for('media') }}"
              >
                <i class="bi bi-camera-video me-1"></i>Fotos y Videos
              </a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link {% if request.endpoint == 'redes' %}active{% endif %}"
                href="{{ url_for('redes') }}"
              >
                <i class="bi bi-share me-1"></i>Redes Sociales
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main>{% block content %}{% endblock %}</main>

    <footer class="bg-dark text-white py-4 mt-5">
      <div class="container text-center">
        <p class="mb-1">
          <i class="bi bi-music-note-beamed me-2"></i>
          <strong>{{ band.name }}</strong> &mdash; {{ band.genre }}
        </p>
        <p class="mb-0 text-muted small">
          &copy; {{ band.founded }}–2026 {{ band.name }}. Todos los derechos
          reservados.
        </p>
      </div>
    </footer>

    {{ bootstrap.load_js() }}
  </body>
</html>
